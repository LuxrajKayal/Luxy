name: PDF editor checks

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/**"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - ".github/workflows/pdf-editor-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate PDF editor integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse website JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          for file in site/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Run PDF editor integration contract tests
        run: node --test tests/pdf-editor-contract.test.mjs
