<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Lux PDF Viewer">
  <title>Lux PDF Viewer</title>
  <script>
    try {
      if (localStorage.getItem("lux-pdf-viewer-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch {}

    try {
      const savedSidebarState = localStorage.getItem("lux-pdf-viewer-sidebar-open");
      document.documentElement.setAttribute(
        "data-sidebar-open",
        savedSidebarState === "false" ? "false" : "true"
      );
    } catch {
      document.documentElement.setAttribute("data-sidebar-open", "true");
    }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body data-focus-mode="false">
  <script>
    try {
      document.body.dataset.focusMode =
        localStorage.getItem("lux-pdf-viewer-focus-mode") === "true" ? "true" : "false";
    } catch {
      document.body.dataset.focusMode = "false";
    }
  </script>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Lux PDF Viewer home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" role="presentation">
          <path d="M8 5v25h21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 14h16v16H17z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name">Lux PDF Viewer</span>
        <span class="brand-slogan">Slogan placeholder — awaiting your wording</span>
      </span>
    </a>

    <div class="topbar-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
        <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
        </svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
        </svg>
      </button>
      <button id="focus-mode-toggle" class="focus-toggle" type="button" aria-pressed="false" aria-label="Turn on Focus Mode" title="Turn on Focus Mode">
        <svg class="focus-icon-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path>
        </svg>
        <svg class="focus-icon-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M3 15h4a2 2 0 0 1 2 2v4M21 15h-4a2 2 0 0 0-2 2v4"></path>
        </svg>
        <span>Focus Mode</span>
      </button>
      <button id="find-text-button" class="find-button" type="button" aria-expanded="false" aria-controls="find-panel" aria-label="Find on page" title="Find on page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 4.2 4.2"></path>
        </svg>
        <span>Find on page</span>
      </button>

      <div id="find-panel" class="find-panel" role="search" aria-label="Find on page" hidden>
        <div class="find-controls">
          <label class="visually-hidden" for="find-input">Text to find</label>
          <input id="find-input" class="find-input" type="search" placeholder="Find on page…" autocomplete="off" spellcheck="false" aria-describedby="find-status">
          <button id="find-next" class="find-action" type="button">Next</button>
          <button id="find-previous" class="find-action" type="button">Previous</button>
          <button id="find-close" class="find-close" type="button" aria-label="Clear highlights and close search" title="Clear and close search">×</button>
        </div>
        <div id="find-status" class="find-status" role="status" aria-live="polite">Type to search this page.</div>
      </div>
    </div>
  </header>

  <div class="workspace-shell">
    <div class="sidebar-toggle-row">
      <button
        id="sidebar-toggle"
        class="sidebar-toggle"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
        aria-label="Close sidebar"
        title="Close sidebar"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <div class="workspace-layout">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar">
        <div class="sidebar-inner">
        <div class="sidebar-drive-tools" aria-label="Google Drive tools">
          <button id="drive-connect-button" class="drive-connect-button" type="button" aria-label="Connect Google Drive" title="Connect Google Drive">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.2 3.5h7.6l6.3 11h-7.6z" fill="#34a853" stroke="none"></path>
              <path d="M8.2 3.5 2 14.5l3.8 6h7.7l-3.8-6-1.5-2.5" fill="#4285f4" stroke="none"></path>
              <path d="M5.8 20.5 2 14.5h12.5l-3.5 6z" fill="#fbbc04" stroke="none"></path>
            </svg>
            <span>Google Drive</span>
          </button>

          <div id="drive-connected-controls" class="drive-connected-controls" hidden>
            <span class="drive-connected-label"><span class="drive-status-dot" aria-hidden="true"></span>Drive Connected</span>
            <button id="drive-avatar-button" class="drive-avatar-button" type="button" aria-label="Open Google Drive picker" title="Open Google Drive">
              <img id="drive-avatar" class="drive-avatar" alt="" hidden>
              <span id="drive-avatar-fallback" class="drive-avatar-fallback" aria-hidden="true">G</span>
            </button>
          </div>

          <button id="drive-sync-button" class="drive-sync-button" type="button" hidden disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7v5h-5M4 17v-5h5"></path>
              <path d="M6.1 9A6.5 6.5 0 0 1 17 6.5L20 12M4 12l3 5.5A6.5 6.5 0 0 0 18 15"></path>
            </svg>
            <span id="drive-sync-label">Sync to Drive</span>
          </button>

          <span id="drive-feedback" class="drive-feedback" role="status" aria-live="polite" hidden></span>

        </div>
        </div>
      </aside>
      <main class="workspace" aria-label="PDF workspace"></main>
    </div>
  </div>
</body>
</html>
