<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A simple plain-text clipboard by Luxraj Kayal.">
  <link rel="icon" type="image/svg+xml" href="./icons/lux-pdf-viewer-icon.svg">
  <title>Clipboard.txt — Luxraj</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #1d2636;
      --muted: #758196;
      --line: #e5e9f0;
      --panel: #ffffff;
      --workspace: #f6f8fb;
      --accent: #4263eb;
      --control-bg: #ffffff;
      --control-border: #dce2ec;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8edf5;
      --muted: #a0aabd;
      --line: #303949;
      --panel: #181e29;
      --workspace: #10151e;
      --accent: #a5b4fc;
      --control-bg: #1d2533;
      --control-border: #3a4557;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; color: var(--ink); background: var(--workspace); }
    button, a, textarea { font: inherit; }
    .topbar {
      min-height: 72px; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand { display: inline-flex; min-width: 0; align-items: center; gap: 11px; color: inherit; text-decoration: none; }
    .brand img { display: block; width: 38px; height: 38px; object-fit: contain; }
    .brand-copy { min-width: 0; }
    .brand-name { display: block; color: var(--ink); font-size: 17px; font-weight: 760; letter-spacing: -.03em; }
    .brand-subtitle { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .file-type { padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    main { width: min(100% - 32px, 980px); flex: 1; margin: 0 auto; padding: clamp(24px, 5vh, 48px) 0; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(25px, 4vw, 34px); letter-spacing: -.045em; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .editor-card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: 0 10px 32px rgb(15 23 42 / 5%); }
    .editor-toolbar { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .editor-label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 7px; }
    .action {
      min-height: 34px; padding: 7px 11px; border: 1px solid var(--control-border); border-radius: 7px;
      color: var(--ink); background: var(--control-bg); cursor: pointer; font-size: 12px; font-weight: 650;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .action:hover { border-color: var(--accent); }
    .action-primary { border-color: var(--accent); color: #ffffff; background: #4263eb; }
    .action-primary:hover { border-color: #2f4fd0; background: #2f4fd0; }
    textarea {
      display: block; width: 100%; min-height: min(58vh, 620px); resize: vertical; padding: 22px;
      border: 0; outline: 0; color: var(--ink); background: var(--panel);
      font: 14px/1.8 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      tab-size: 2; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    textarea::placeholder { color: var(--muted); opacity: .8; }
    .editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    #status { min-height: 1em; text-align: right; }
    .copyright { padding: 18px 16px 22px; border-top: 1px solid var(--line); color: var(--muted); background: var(--panel); font-size: 11px; text-align: center; }
    .copyright strong { color: var(--ink); font-weight: 650; }
    button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 560px) {
      .topbar { min-height: 64px; padding: 10px 14px; }
      .brand img { width: 32px; height: 32px; }
      .brand-name { font-size: 15px; }
      main { width: min(100% - 20px, 980px); padding-top: 24px; }
      .page-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
      .editor-toolbar { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; justify-content: flex-start; }
      textarea { min-height: 55vh; padding: 15px; font-size: 13px; }
      .editor-footer { align-items: flex-start; flex-direction: column; gap: 5px; }
      #status { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
  <script>
    try {
      if (localStorage.getItem("lux-pdf-viewer-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Return to Lux PDF Viewer">
      <img src="./icons/lux-pdf-viewer-icon.svg" alt="" width="38" height="38">
      <span class="brand-copy">
        <span class="brand-name">Luxraj Clipboard</span>
        <span class="brand-subtitle">A simple plain-text workspace</span>
      </span>
    </a>
    <span class="file-type">.TXT</span>
  </header>

  <main>
    <div class="page-heading">
      <div>
        <h1>Clipboard.txt</h1>
        <p class="subtitle">Type or paste plain text here. Copy it for later use or download it as a text file.</p>
      </div>
    </div>

    <section class="editor-card" aria-label="Clipboard text editor">
      <div class="editor-toolbar">
        <span class="editor-label"><span class="status-dot" aria-hidden="true"></span>Plain text</span>
        <div class="actions">
          <button id="copy-text" class="action" type="button">Copy text</button>
          <button id="clear-text" class="action" type="button">Clear</button>
          <button id="download-text" class="action action-primary" type="button">Download .txt</button>
        </div>
      </div>
      <textarea id="clipboard-text" spellcheck="false" aria-label="Clipboard text" placeholder="Paste or type your text here…"></textarea>
      <div class="editor-footer">
        <span id="character-count">0 characters</span>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <footer class="copyright">
    © 2026 <strong>Luxraj (Subrata) Kayal</strong>. All rights reserved.
  </footer>

  <script>
    const textArea = document.querySelector("#clipboard-text");
    const status = document.querySelector("#status");
    const characterCount = document.querySelector("#character-count");

    function updateCharacterCount() {
      const count = textArea.value.length;
      characterCount.textContent = count + (count === 1 ? " character" : " characters");
    }

    function setStatus(message) {
      status.textContent = message;
    }

    textArea.addEventListener("input", updateCharacterCount);

    document.querySelector("#copy-text").addEventListener("click", async () => {
      if (!textArea.value) {
        setStatus("Nothing to copy yet.");
        return;
      }
      try {
        await navigator.clipboard.writeText(textArea.value);
        setStatus("Text copied.");
      } catch {
        textArea.focus();
        textArea.select();
        const copied = document.execCommand("copy");
        setStatus(copied ? "Text copied." : "Select the text and copy it manually.");
      }
    });

    document.querySelector("#clear-text").addEventListener("click", () => {
      if (!textArea.value) {
        setStatus("Clipboard is already empty.");
        return;
      }
      textArea.value = "";
      updateCharacterCount();
      setStatus("Text cleared.");
      textArea.focus();
    });

    document.querySelector("#download-text").addEventListener("click", () => {
      const blob = new Blob([textArea.value], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = "clipboard.txt";
      document.body.append(downloadLink);
      downloadLink.click();
      downloadLink.remove();
      URL.revokeObjectURL(url);
      setStatus("Downloaded clipboard.txt.");
    });
  </script>
</body>
</html>
